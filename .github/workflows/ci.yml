name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdformat --check autoload sim view tests tools
      - run: gdlint autoload sim view tests tools

  test:
    name: Tes (GUT & Determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Godot
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$URL" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import proyek
        run: godot --headless --import

      - name: Tes unit (GUT)
        run: godot --headless -s addons/gut/gut_cmdln.gd

      - name: Tes determinism (runner headless)
        run: |
          for seed in 42 99 1337; do
            echo "=== seed $seed ==="
            godot --headless -s tools/run_sim.gd -- --seed "$seed" --ticks 1000 --check-twice
          done

      - name: Pemeriksaan aturan arsitektur
        run: |
          if grep -rnE "^extends Node" sim/; then
            echo "::error::sim/ tidak boleh extends Node"; exit 1
          fi
          if grep -rnP --include='*.gd' "(?<![.\w])(randf|randi|randf_range|randi_range|randfn|randomize|rand_from_seed)\(" sim/; then
            echo "::error::sim/ tidak boleh memakai RNG global"; exit 1
          fi
          if grep -rnE --include='*.gd' "\.(shuffle|pick_random)\(" sim/; then
            echo "::error::sim/ tidak boleh memakai shuffle/pick_random (pakai RNG ber-seed)"; exit 1
          fi
          if grep -rnP --include='*.gd' "\b(Time|OS)\.[a-z_]+\(" sim/; then
            echo "::error::sim/ tidak boleh memanggil Time atau OS"; exit 1
          fi
